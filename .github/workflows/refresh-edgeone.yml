name: 每日两次更新番剧目录

on:
  schedule:
    - cron: '0 7,19 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bangumi-index-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 获取网站源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查部署凭证是否已配置
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "请先在仓库 Actions Secrets 中配置 EDGEONE_API_TOKEN。"
            exit 1
          fi

      - name: 安装更新脚本的依赖
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 更新两个平台并完成数据检查
        run: npm run update

      - name: 保存完整更新后的缓存与目录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dist/catalog.json dist/data.js dist/gamer-catalog.json dist/gamer-data.js dist/home-data.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh anime catalogs"
            git push
          fi

      - name: 发布到现有 EdgeOne 生产项目
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx --yes edgeone@1.6.41 makers deploy ./dist -n bangumi-index -t "$EDGEONE_API_TOKEN" -e production

      - name: 核对自定义域名上的目录数据
        timeout-minutes: 15
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { setTimeout as delay } from 'node:timers/promises';
          const files = ['catalog.json', 'data.js', 'gamer-catalog.json', 'gamer-data.js'];
          const expected = await Promise.all(files.map(file => readFile('dist/' + file)));
          for (let attempt = 1; attempt <= 30; attempt++) {
            let synced = true;
            for (let index = 0; index < files.length; index++) {
              const file = files[index];
              const query = [process.env.GITHUB_RUN_ID, process.env.GITHUB_RUN_ATTEMPT, attempt].join('-');
              try {
                const response = await fetch('https://www.qianmoqingyu.dpdns.org/' + file + '?updated=' + query, {
                  headers: { 'Cache-Control': 'no-cache' },
                  signal: AbortSignal.timeout(30000)
                });
                if (!response.ok || !Buffer.from(await response.arrayBuffer()).equals(expected[index])) {
                  synced = false;
                  console.log('第 ' + attempt + ' 次核对：' + file + ' 尚未同步，稍后重试。');
                  break;
                }
              } catch (error) {
                synced = false;
                console.log('第 ' + attempt + ' 次核对：' + file + ' 请求失败：' + error.message);
                break;
              }
            }
            if (synced) {
              console.log('四个目录文件已与本次发布一致。');
              process.exit(0);
            }
            if (attempt < 30) await delay(20000);
          }
          console.error('::error::域名目录未在等待时间内与本次发布一致，请检查 EdgeOne 部署和缓存。');
          process.exit(1);
          NODE
